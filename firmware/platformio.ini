; ESP32 + DS18B20 harorat datchigi -> HTTPS server
; Yig'ish:   pio run                       (natija: .pio/build/esp32dev/firmware.bin - dashboardga OTA uchun yuklanadi)
; Yozish:    pio run -t upload --upload-port <port>   (port: Windows COM5, macOS /dev/cu.usbserial-xxxx)
; Kuzatish:  pio device monitor
;
; Versiyalar qotirilgan: har qanday kompyuterda bir xil proshivka yig'iladi.
; Kod Arduino-ESP32 3.x ni talab qiladi (NetworkClientSecure); rasmiy "espressif32" platformasi 2.x beradi,
; shuning uchun pioarduino platformasi ishlatiladi (Arduino 3.3.12, ESP-IDF 5.5.5).

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Ikki OTA bo'limi (app0/app1, har biri 1.9 MB) - masofadan yangilash uchun shart. NVS joyi o'zgarmaydi.
board_build.partitions = min_spiffs.csv
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    marcoschwartz/LiquidCrystal_I2C@1.1.4
